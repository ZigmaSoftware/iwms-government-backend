name: IWMS Government Backend CI/CD

# Trigger: push to "main" ONLY -> build the image on the server itself and
# restart the service. Pushes to dev or any feature branch do nothing at all -
# the workflow does not even start.
#
# WHY A SELF-HOSTED RUNNER
# GitHub's cloud runners cannot reach this server: only ports 3000/9001/80 are
# forwarded from the public IP (115.245.93.26 -> 192.168.1.128), and 22 is not.
# A self-hosted runner polls GitHub *outbound* over HTTPS, so no inbound port,
# no router change and no SSH key are needed. That also means the image is
# built where it runs, so GHCR is not in the deploy path at all.
on:
  push:
    branches: [main]
  workflow_dispatch:        # allow a manual re-deploy from the Actions tab

jobs:
  deploy:
    runs-on: [self-hosted, iwms-government]
    # Never let two deploys touch the same containers at once.
    concurrency:
      group: deploy-backend
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The runner works in its own directory; the live deployment (with its
      # .env, media/ and static/) lives here. Build from the checkout, then
      # restart the service in the deployment directory.
      - name: Build image
        run: |
          docker build \
            -t ghcr.io/zigmasoftware/iwms-government-backend:${{ github.sha }} \
            -t ghcr.io/zigmasoftware/iwms-government-backend:latest \
            .

      # Fail before touching the running service if the new image cannot reach
      # MySQL. network_mode: host + DB_HOST=localhost is what makes this work;
      # a bridged container cannot reach the loopback-bound database.
      - name: Smoke-test the new image against the database
        working-directory: /home/admin/localserver/iwmsGovernment/iwms-government-backend
        run: |
          docker run --rm --env-file .env --network host \
            ghcr.io/zigmasoftware/iwms-government-backend:${{ github.sha }} \
            python -c "
          import os, django
          os.environ.setdefault('DJANGO_SETTINGS_MODULE','config.settings')
          django.setup()
          from django.db import connection
          with connection.cursor() as c:
              c.execute('SELECT DATABASE()')
              print('DB OK:', c.fetchone()[0])
          "

      - name: Restart the service
        working-directory: /home/admin/localserver/iwmsGovernment/iwms-government-backend
        run: sudo /usr/bin/systemctl restart iwms-government-backend

      - name: Run migrations and collectstatic
        working-directory: /home/admin/localserver/iwmsGovernment/iwms-government-backend
        run: |
          for i in $(seq 1 30); do
            docker compose -f docker-compose.production.yml exec -T backend true 2>/dev/null && break
            sleep 2
          done
          docker compose -f docker-compose.production.yml exec -T backend python manage.py migrate --noinput
          docker compose -f docker-compose.production.yml exec -T backend python manage.py collectstatic --noinput

      # 401 = healthy: auth rejecting an unauthenticated request proves Django
      # ran and reached MySQL. 000 = nothing listening, 500 = database problem.
      - name: Verify the API is serving
        run: |
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 3 \
              http://127.0.0.1:9001/api/v1/masters/districts/ || echo 000)
            case "$CODE" in
              200|401|403) echo "API healthy (HTTP $CODE)"; exit 0 ;;
            esac
            sleep 2
          done
          echo "::error::API did not become healthy (last HTTP $CODE)"
          sudo /usr/bin/systemctl status iwms-government-backend --no-pager -n 30 || true
          exit 1

      - name: Prune dangling images
        if: always()
        run: docker image prune -f
