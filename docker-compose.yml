# IWMS Government Backend — production compose
#
# (Renamed from docker-compose.production.yml to docker-compose.yml — this is
# now the default filename docker compose CLI picks up with no -f flag.)
#
# DB runs as its own container ("db", mariadb:11.8) on the default compose
# network. backend reaches it at the hostname "db" (Docker's internal DNS),
# not via network_mode: host / localhost anymore.
#
# IMPORTANT — data safety:
#   The db service uses a NAMED VOLUME (iwms_gov_db). Compose never deletes a
#   named volume on `up`, `restart`, or plain `down` — only `down -v` would.
#   deploy.yml deliberately runs `docker compose up -d db` (never
#   `--force-recreate`, `down`, or `down -v`) so an EXISTING db
#   container/volume is left completely untouched, and only a genuinely
#   MISSING one gets created fresh.
#
# Migrating data from the old host-installed MariaDB into this container is a
# separate, manual, one-time step — NOT something CI/CD does automatically.
# Until that migration happens, a freshly created db container starts EMPTY.
services:
  db:
    image: mariadb:11.8
    environment:
      MARIADB_DATABASE: ${DB_NAME:-iwmsdbGovernment}
      MARIADB_USER: ${DB_USER:-iwms_prod}
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      # root password kept equal to DB_PASSWORD so DB_USER=root (as .env is
      # normally configured for this project) also works unchanged.
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    volumes:
      - iwms_gov_db:/var/lib/mysql
    restart: always
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # No host port published: the "backend" container reaches this over the
    # internal compose network at the "redis" hostname regardless. Local dev
    # via `manage.py runserver` on the host uses the system-installed
    # redis-server on 127.0.0.1:6379 instead (see .env) to avoid a port clash
    # with this container.
    volumes:
      - iwms_gov_redis:/data
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ghcr.io/zigmasoftware/iwms-government-backend:latest
    build: .
    env_file: .env
    environment:
      # Always target the compose-managed db/redis containers, regardless of
      # whatever DB_HOST/REDIS_URL happen to be set to in .env.
      DB_HOST: db
      DB_PORT: 3306
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "9001:9001"
    volumes:
      - ./media:/app/media
      - ./static:/app/static
      # Migrations are gitignored (**/migrations/*), so a CI build - which
      # works from a git checkout - produces an image with an EMPTY
      # app/migrations/. Without this mount `manage.py migrate` inside the
      # container dies with:
      #   ValueError: Dependency on app with no migrations: app
      # Mounting the host's real migration files makes migrate work in any
      # container, CI-built or locally built, without tracking them in git.
      - ./app/migrations:/app/app/migrations
    restart: always

volumes:
  iwms_gov_db:
  iwms_gov_redis:
